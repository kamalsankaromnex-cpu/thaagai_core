services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: thaagai
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: thaagai
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thaagai"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
