      <stop offset="0%" stop-color="#211D1E"/>
      <stop offset="50%" stop-color="#3A1724"/>
      <stop offset="100%" stop-color="#5E1028"/>
    </linearGradient>
    <radialGradient id="goldGlow3" cx="80%" cy="50%" r="50%">
